[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.dependencies]
# Math types
approx = "0.5"
serde = { version = "1.0", features = ["derive"] }

# Graphics for demo
winit = "0.29"
wgpu = "0.18"
pollster = "0.3"
env_logger = "0.10"
log = "0.4"

# Randomness for tests and debug tooling
rand = "0.8"

# Benchmarking
criterion = "0.5"

# Serialization
ron = "0.8"
serde_json = "1.0"
bincode = "1.3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

[profile.bench]
inherits = "release"
debug = true
