[package]
name = "ro_physics"
version = "0.1.0"
edition = "2021"
authors = ["Ro-Physics Team"]
description = "A production-grade 2D rigid-body physics engine in Rust"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["physics", "2d", "rigid-body", "collision", "simulation"]
categories = ["game-development", "simulation"]

[dependencies]
nalgebra = { workspace = true }
approx = { workspace = true }
serde = { workspace = true }
rand = { workspace = true }
rand_distr = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }

[features]
default = []
serialization = ["serde/derive"]

[lib]
name = "ro_physics"
path = "src/lib.rs"

[[bench]]
name = "math"
harness = false

[[bench]]
name = "collision"
harness = false

[[bench]]
name = "solver"
harness = false

[[bench]]
name = "stress"
harness = false
